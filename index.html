<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Entretenimiento</title>
    <link rel="stylesheet" href="https://latele-envivo.com/styles63.min.css">
    <link rel="stylesheet" href="https://latele-envivo.com/stylez.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ececec;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
        }
        nav a {
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            text-align: center;
        }
        nav a:hover {
            background-color: #68C420;
        }
        .content {
            display: none;
            padding: 20px;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 400px; /* Reduce el tamaño del iframe */
            loading: lazy; /* Optimiza el tiempo de carga */
        }
        .show {
            display: block;
        }
        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #68C420;
            color: white;
            border: none;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            iframe {
                height: 250px; /* Reduce el tamaño del iframe en dispositivos pequeños */
            }
        }
    </style>
    <script async src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.0/jquery.min.js"></script>
    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.content').forEach(content => content.classList.remove('show'));
            document.getElementById(sectionId).classList.add('show');
        }

        function backToMenu() {
            document.querySelectorAll('.content').forEach(content => content.classList.remove('show'));
        }
    </script>
</head>
<body>

<header>
    <h1>Centro de Entretenimiento</h1>
</header>

<nav>
    <a href="javascript:void(0);" onclick="showSection('tv')">TV</a>
    <a href="javascript:void(0);" onclick="showSection('tv')">TV+</a>
    <a href="javascript:void(0);" onclick="showSection('deportes')">Deportes</a>
    <a href="javascript:void(0);" onclick="showSection('peliculas')">Películas</a>
    <a href="javascript:void(0);" onclick="showSection('canales-chile')">Canales Chilenos</a>
</nav>

<div class="content" id="tv">
    <h2>TV</h2>
    <iframe src="tv1.html" allow="encrypted-media" allowfullscreen></iframe>
    <button class="back-button" onclick="backToMenu()">Regresar al Menú</button>
</div>
<div class="content" id="tv">
    <h2>TV+</h2>
    <iframe src="tv2.html" allow="encrypted-media" allowfullscreen></iframe>
    <button class="back-button" onclick="backToMenu()">Regresar al Menú</button>
</div>
<div class="content" id="deportes">
    <h2>Deportes</h2>
    <iframe src="fubol.html" allow="encrypted-media" allowfullscreen></iframe>
    <button class="back-button" onclick="backToMenu()">Regresar al Menú</button>
</div>

<div class="content" id="peliculas">
    <h2>Películas</h2>
    <iframe src="peliculas.html" allow="encrypted-media" allowfullscreen></iframe>
    <button class="back-button" onclick="backToMenu()">Regresar al Menú</button>
</div>

<div class="content" id="canales-chile">
    <h2>Canales Chilenos</h2>
    <iframe src="canaleschile.html" allow="encrypted-media" allowfullscreen></iframe>
    <button class="back-button" onclick="backToMenu()">Regresar al Menú</button>
</div>

</body>
</html>
